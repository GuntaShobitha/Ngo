<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | STACKLY</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #060b18;
      --bg2: #0b1224;
      --accent: #22c55e;
      --accent-glow: rgba(34,197,94,0.12);
      --text: #f1f5f9;
      --muted: #64748b;
      --border: rgba(255,255,255,0.1);
      --font-h: 'Syne', sans-serif;
      --font-b: 'DM Sans', sans-serif;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%);
      top: -200px; left: -200px;
      animation: orbFloat1 8s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,197,94,0.06) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      animation: orbFloat2 10s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(34,197,94,0.04) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orbPulse 5s ease-in-out infinite;
    }
    @keyframes orbFloat1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(60px, 40px) scale(1.1); }
    }
    @keyframes orbFloat2 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-50px, -30px) scale(1.05); }
    }
    @keyframes orbPulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%,-50%) scale(1.2); }
    }

    /* ── FLOATING ICONS ── */
    .floating-icons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .floating-icon {
      position: absolute;
      color: rgba(34,197,94,0.15);
      font-size: 1.5rem;
      animation: iconDrift linear infinite;
    }
    @keyframes iconDrift {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── GRID LINES ── */
    .grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    /* ── MAIN CONTENT ── */
    .error-wrap {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px;
      max-width: 600px;
      width: 100%;
    }

    /* ── GLASSMORPHISM CARD ── */
    .error-card {
      background: rgba(11,18,36,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 56px 48px;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 1px rgba(34,197,94,0.05);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .error-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, #86efac, #22c55e, transparent);
      background-size: 200% 100%;
      animation: borderShine 3s linear infinite;
    }
    @keyframes borderShine { to { background-position: -200% 0; } }

    /* ── 404 TEXT ── */
    .error-num {
      font-family: var(--font-h);
      font-size: clamp(7rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #22c55e 0%, #86efac 50%, #22c55e 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradShift 4s ease-in-out infinite alternate, numBounce 0.8s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
      display: inline-block;
    }
    @keyframes gradShift {
      from { background-position: 0% 50%; }
      to   { background-position: 100% 50%; }
    }
    @keyframes numBounce {
      from { opacity: 0; transform: scale(0.5) translateY(-30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Glitch effect on 404 */
    .error-num::before,
    .error-num::after {
      content: '404';
      position: absolute;
      top: 0; left: 0;
      font-family: var(--font-h);
      font-size: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, #22c55e, #86efac);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.3;
    }
    .error-num::before {
      animation: glitch1 3.5s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
    .error-num::after {
      animation: glitch2 3.5s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }
    @keyframes glitch1 {
      0%,90%,100% { transform: translate(0); opacity: 0; }
      92%          { transform: translate(-4px,2px); opacity: 0.4; }
      94%          { transform: translate(4px,-2px); opacity: 0.4; }
      96%          { transform: translate(0); opacity: 0; }
    }
    @keyframes glitch2 {
      0%,90%,100% { transform: translate(0); opacity: 0; }
      93%          { transform: translate(4px,2px); opacity: 0.4; }
      95%          { transform: translate(-4px,-2px); opacity: 0.4; }
      97%          { transform: translate(0); opacity: 0; }
    }

    /* ── ICON RING ── */
    .error-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px; height: 70px;
      background: var(--accent-glow);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 50%;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0 auto 20px;
      animation: iconSpin 0.8s 0.6s cubic-bezier(0.34,1.56,0.64,1) both, iconGlow 3s 1.4s ease-in-out infinite;
    }
    @keyframes iconSpin {
      from { opacity: 0; transform: scale(0) rotate(-180deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes iconGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
      50%      { box-shadow: 0 0 25px 6px rgba(34,197,94,0.2); }
    }

    /* ── TEXT ── */
    .error-title {
      font-family: var(--font-h);
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 800;
      margin-bottom: 14px;
      animation: fadeUp 0.7s 0.5s ease both;
    }
    .error-sub {
      color: var(--muted);
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      line-height: 1.75;
      max-width: 380px;
      margin: 0 auto 32px;
      animation: fadeUp 0.7s 0.7s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── BUTTON ── */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #000;
      padding: 14px 32px;
      border-radius: 12px;
      font-family: var(--font-h);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s 0.9s ease both,
                 btnGlow 2.5s 1.9s ease-in-out infinite;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
    }
    .btn-home:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 16px 40px rgba(34,197,94,0.45);
      animation: none;
    }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
      50%      { box-shadow: 0 0 25px 6px rgba(34,197,94,0.3); }
    }
    .btn-home i { transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .btn-home:hover i { transform: translateX(-4px); }

    /* Ripple */
    .btn-home::after {
      content: '';
      position: absolute;
      
      inset: 0;
      background: rgba(0,0,0,0.1);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-home:hover::after { opacity: 1; }

    

    /* ── QUICK LINKS ── */
    .quick-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
      animation: fadeUp 0.7s 1.3s ease both;
    }
    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .quick-link:hover {
      background: var(--accent-glow);
      border-color: rgba(34,197,94,0.3);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .quick-link i { font-size: 0.72rem; color: var(--accent); }

    /* ── LOGO ── */
    .error-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-h);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 32px;
      animation: fadeUp 0.7s 0.1s ease both;
    }
    .error-logo i { color: var(--accent); }
    .error-logo span { color: var(--accent); }

    /* ── DIVIDER ── */
    .error-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 28px 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .error-card { padding: 40px 24px; border-radius: 20px; }
      .error-num { font-size: clamp(5rem, 22vw, 7rem); }
      .btn-home { padding: 12px 24px; font-size: 0.88rem; }
      .quick-links { gap: 8px; }
      .quick-link { padding: 7px 12px; font-size: 0.72rem; }
    }
    @media (max-width: 380px) {
      .error-card { padding: 32px 18px; }
      .error-num { font-size: 5rem; }
    }
  </style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-canvas">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
</div>
<div class="grid-lines"></div>
<div class="floating-icons" id="floatingIcons"></div>

<!-- MAIN CARD -->
<div class="error-wrap">
  <div class="error-card">

    <a href="index.html" class="error-logo">
      <i class="fas fa-seedling"></i><span>STACKLY</span>
    </a>

    <div class="error-num">404</div>

    <div class="error-icon">
      <i class="fas fa-map-signs"></i>
    </div>

    <h1 class="error-title">Page Not Found</h1>
    <p class="error-sub">
      Looks like this path leads somewhere we haven't mapped yet.
      Let's get you back to where change is happening.
    </p>

    <a href="index.html" class="btn-home">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>

    <div class="error-divider"></div>

    <!-- QUICK LINKS -->
    <div class="quick-links">
      <a href="about.html"     class="quick-link"><i class="fas fa-info-circle"></i>About</a>
      <a href="campaigns.html" class="quick-link"><i class="fas fa-heart"></i>Campaigns</a>
      <a href="services.html"  class="quick-link"><i class="fas fa-hands-helping"></i>Services</a>
      <a href="index.html"     class="quick-link"><i class="fas fa-home"></i>Home</a>
    </div>

    <!-- COUNTDOWN -->
    

  </div>
</div>

<script>
  /* ── FLOATING ICONS ── */
  const icons = ['fa-heart','fa-leaf','fa-hands-helping','fa-globe-africa','fa-seedling','fa-graduation-cap','fa-users','fa-star'];
  const container = document.getElementById('floatingIcons');
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('i');
    el.className = 'fas ' + icons[Math.floor(Math.random() * icons.length)] + ' floating-icon';
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      font-size: ${Math.random() * 1.2 + 0.8}rem;
      animation-duration: ${Math.random() * 15 + 12}s;
      animation-delay: ${Math.random() * 10}s;
    `;
    container.appendChild(el);
  }

  
  
  /* ── RIPPLE ON BUTTON ── */
  document.querySelector('.btn-home').addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top  - size / 2;
    const rip = document.createElement('span');
    rip.style.cssText = `
      position:absolute; border-radius:50%;
      background:rgba(255,255,255,0.2);
      width:${size}px; height:${size}px;
      left:${x}px; top:${y}px;
      transform:scale(0);
      animation:ripple 0.6s linear;
      pointer-events:none;
    `;
    this.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
  });
</script>

<style>
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
</style>


<!-- FLOATING DONATE WIDGET -->
<div id="floating-donate" style="position:fixed;bottom:32px;right:28px;z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:10px">
  <div class="float-donate-card">
    <div class="fdc-title">Quick Donate 💚</div>
    <div class="fdc-amounts">
      <button class="fdc-amt" onclick="selectAmt(this,'10')">$10</button>
      <button class="fdc-amt active" onclick="selectAmt(this,'25')">$25</button>
      <button class="fdc-amt" onclick="selectAmt(this,'50')">$50</button>
      <button class="fdc-amt" onclick="selectAmt(this,'100')">$100</button>
    </div>
    <a href="campaigns.html" class="fdc-cta" id="fdc-cta">Donate $25 Now</a>
  </div>
  <div class="float-donate-btn-wrap">
    <span class="float-donate-pulse"></span>
    <a href="campaigns.html" class="float-donate-btn"><i class="fas fa-heart"></i> Donate Now</a>
  </div>
</div>
<script>
(function(){const bar=document.getElementById('scroll-progress');if(!bar)return;window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-window.innerHeight;bar.style.width=(window.scrollY/h*100)+'%';},{passive:true});})();
function selectAmt(el,val){document.querySelectorAll('.fdc-amt').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('fdc-cta').textContent='Donate $'+val+' Now';}
(function(){const w=document.getElementById('floating-donate'),footer=document.querySelector('footer');if(!w||!footer)return;new IntersectionObserver(e=>{w.style.opacity=e[0].isIntersecting?'0':'1';w.style.pointerEvents=e[0].isIntersecting?'none':'';},{threshold:0.1}).observe(footer);})();
</script>













<script>
// Clean layout scroll indicator with zero automated forward redirects or countdown timers
(function(){
  const bar = document.getElementById('scroll-progress');
  if(!bar) return;
  window.addEventListener('scroll',()=>{
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (window.scrollY / h * 100) + '%';
  },{passive:true});
})();

function selectAmt(el,val){
  document.querySelectorAll('.fdc-amt').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fdc-cta').textContent='Donate $'+val+' Now';
}

// Controls visibility of floating donation card near footer
(function(){
  const w = document.getElementById('floating-donate');
  const footer = document.querySelector('footer');
  if(!w || !footer) return;
  new IntersectionObserver(e => {
    w.style.opacity = e[0].isIntersecting ? '0' : '1';
    w.style.pointerEvents = e[0].isIntersecting ? 'none' : '';
  },{threshold:0.1}).observe(footer);
})();
</script>













</body>
